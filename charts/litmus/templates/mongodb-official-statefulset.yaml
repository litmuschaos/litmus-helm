{{- if .Values.mongoOfficial.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb-official
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litmus-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-official
spec:
  serviceName: {{ .Release.Name }}-mongodb-official
  replicas: {{ .Values.mongoOfficial.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mongodb-official
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mongodb-official
        {{- include "litmus-portal.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongoOfficial.image.registry }}/{{ .Values.mongoOfficial.image.repository }}:{{ .Values.mongoOfficial.image.tag }}"
          imagePullPolicy: {{ .Values.mongoOfficial.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              {{- if .Values.mongoOfficial.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongoOfficial.auth.existingSecret }}
                  key: {{ .Values.mongoOfficial.auth.usernameKey }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mongodb-official
                  key: {{ .Values.mongoOfficial.auth.usernameKey }}
              {{- end }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              {{- if .Values.mongoOfficial.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongoOfficial.auth.existingSecret }}
                  key: {{ .Values.mongoOfficial.auth.passwordKey }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mongodb-official
                  key: {{ .Values.mongoOfficial.auth.passwordKey }}
              {{- end }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 20
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 20
          {{- with .Values.mongoOfficial.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data/db
      {{- if not .Values.mongoOfficial.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.mongoOfficial.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongoOfficial.persistence.storageClass }}
        storageClassName: {{ .Values.mongoOfficial.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongoOfficial.persistence.size }}
  {{- end }}
{{- end }}
