{{- if and .Values.mongoOfficial.enabled (not .Values.mongoOfficial.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongodb-official
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litmus-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-official
type: Opaque
stringData:
  {{ .Values.mongoOfficial.auth.usernameKey }}: {{ .Values.mongoOfficial.auth.rootUser | quote }}
  {{ .Values.mongoOfficial.auth.passwordKey }}: {{ .Values.mongoOfficial.auth.rootPassword | quote }}
{{- end }}
