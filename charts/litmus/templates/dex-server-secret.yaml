{{- if .Values.dexServer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litmus-portal.fullname" . }}-dex-server-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litmus-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "litmus-portal.name" . }}-dex-server
type: Opaque
data:
  secret: {{ .Values.dexServer.secret | b64enc | quote }}
{{- end }}
